<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Cat - Deportes en Vivo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-dark: #121824;
      --card-border: #1e2638;
      --text-primary: #ffffff;
      --text-secondary: #8d9bb0;
      --accent-live: #00e676;
      --accent-brand: #ff9f0a;
      --accent-blue: #29b6f6;
      --touch-hover: #1a2234;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      padding-bottom: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Navbar superior */
    header {
      width: 100%;
      max-width: 650px;
      background: rgba(10, 14, 23, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      background: linear-gradient(135deg, #ff9f0a, #ff5e3a);
      color: #000;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
    }

    .live-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-live);
      background: rgba(0, 230, 118, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 230, 118, 0.2);
    }

    .dot-pulse {
      width: 7px;
      height: 7px;
      background-color: var(--accent-live);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-live);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Pestañas de Deportes */
    .sports-tabs-container {
      width: 100%;
      max-width: 650px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 12px 16px;
      scrollbar-width: none;
    }

    .sports-tabs-container::-webkit-scrollbar {
      display: none;
    }

    .sports-tabs {
      display: inline-flex;
      gap: 8px;
    }

    .tab-btn {
      background: var(--card-dark);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent-brand);
      color: #000;
      border-color: var(--accent-brand);
    }

    .tab-btn:active {
      transform: scale(0.96);
    }

    /* Contenedor Principal */
    .content-area {
      width: 100%;
      max-width: 650px;
      padding: 0 16px;
    }

    /* Tarjetas de eventos */
    .match-card {
      background-color: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      transition: transform 0.15s ease, background-color 0.15s ease;
      cursor: pointer;
    }

    .match-card:active {
      transform: scale(0.98);
      background-color: var(--touch-hover);
    }

    .match-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .league-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-tag {
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
    }

    .status-tag.live {
      background: rgba(0, 230, 118, 0.15);
      color: var(--accent-live);
    }

    .status-tag.upcoming {
      background: rgba(41, 182, 246, 0.15);
      color: var(--accent-blue);
    }

    .teams-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .team-score {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .team-score.winner {
      color: var(--accent-live);
    }

    /* Mensajes de carga */
    .loader {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">SPORTS CAT</div>
    </div>
    <div class="live-pill">
      <div class="dot-pulse"></div>
      <span>EN VIVO</span>
    </div>
  </header>

  <!-- Categorías acotadas a tus deportes clave -->
  <div class="sports-tabs-container">
    <div class="sports-tabs">
      <button class="tab-btn active" onclick="filtrarDeporte('all', this)">⚡ Todos</button>
      <button class="tab-btn" onclick="filtrarDeporte('Soccer', this)">⚽ Fútbol</button>
      <button class="tab-btn" onclick="filtrarDeporte('Basketball', this)">🏀 NBA</button>
      <button class="tab-btn" onclick="filtrarDeporte('Baseball', this)">⚾ MLB</button>
      <button class="tab-btn" onclick="filtrarDeporte('American Football', this)">🏈 NFL</button>
      <button class="tab-btn" onclick="filtrarDeporte('Fighting', this)">🥊 UFC</button>
    </div>
  </div>

  <div class="content-area" id="app">
    <div class="loader">Cargando marcadores en tiempo real...</div>
  </div>

  <script>
    let eventosOriginales = [];

    async function cargarPartidos() {
      const app = document.getElementById('app');
      try {
        const hoy = new Date().toISOString().split('T')[0];
        const res = await fetch(`https://www.thesportsdb.com/api/v1/json/3/eventsday.php?d=${hoy}`);
        const data = await res.json();
        
        if (!data.events || data.events.length === 0) {
          app.innerHTML = '<div class="loader">No hay eventos agendados para los deportes seleccionados hoy.</div>';
          return;
        }

        // Guardar eventos
        eventosOriginales = data.events;
        renderizarEventos(eventosOriginales);

      } catch (err) {
        app.innerHTML = '<div class="loader">Sincronizando información de eventos...</div>';
      }
    }

    function renderizarEventos(lista) {
      const app = document.getElementById('app');
      app.innerHTML = '';

      if (lista.length === 0) {
        app.innerHTML = '<div class="loader">No hay partidos disponibles en esta categoría hoy.</div>';
        return;
      }

      lista.forEach(event => {
        const card = document.createElement('div');
        card.className = 'match-card';

        const esVivo = event.strStatus && (event.strStatus.includes('Q') || event.strStatus.includes('H') || event.strStatus.includes('Live'));
        const statusClass = esVivo ? 'live' : 'upcoming';

        card.innerHTML = `
          <div class="match-meta">
            <div class="league-badge">
              <span>${event.strSport || 'Deporte'} • ${event.strLeague || 'Liga'}</span>
            </div>
            <span class="status-tag ${statusClass}">${event.strStatus || 'Programado'}</span>
          </div>
          <div class="teams-container">
            <div class="team-row">
              <div class="team-info">
                <span>${event.strHomeTeam}</span>
              </div>
              <span class="team-score ${event.intHomeScore > event.intAwayScore ? 'winner' : ''}">${event.intHomeScore ?? '-'}</span>
            </div>
            <div class="team-row">
              <div class="team-info">
                <span>${event.strAwayTeam}</span>
              </div>
              <span class="team-score ${event.intAwayScore > event.intHomeScore ? 'winner' : ''}">${event.intAwayScore ?? '-'}</span>
            </div>
          </div>
        `;
        app.appendChild(card);
      });
    }

    function filtrarDeporte(sport, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (sport === 'all') {
        renderizarEventos(eventosOriginales);
      } else {
        const filtrados = eventosOriginales.filter(e => e.strSport && e.strSport.toLowerCase().includes(sport.toLowerCase()));
        renderizarEventos(filtrados);
      }
    }

    cargarPartidos();
  </script>
</body>
</html>
