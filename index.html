<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sports Cat - Resultados en Vivo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: #121824;
      --bg-card-hover: #1a2234;
      --border-color: #1e283d;
      --accent-green: #00e676;
      --accent-orange: #ff9f0a;
      --accent-blue: #29b6f6;
      --text-white: #ffffff;
      --text-muted: #8d9bb0;
      --text-sub: #5c6b80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      padding-bottom: 75px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 680px;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #ff9f0a, #ff5e3a);
      color: #000;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      letter-spacing: 1.2px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-green);
      background: rgba(0, 230, 118, 0.12);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 230, 118, 0.25);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    .date-bar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-around;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 0;
    }

    .date-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .date-btn.active {
      background: rgba(255, 159, 10, 0.15);
      color: var(--accent-orange);
    }

    .sports-nav {
      width: 100%;
      max-width: 680px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 10px 16px;
      scrollbar-width: none;
    }
    .sports-nav::-webkit-scrollbar { display: none; }

    .sport-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-right: 6px;
      cursor: pointer;
    }

    .sport-chip.active {
      background: var(--accent-orange);
      color: #000;
      border-color: var(--accent-orange);
    }

    main {
      width: 100%;
      max-width: 680px;
      padding: 0 12px;
    }

    .league-group {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .league-header {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .match-item {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .match-item:last-child { border-bottom: none; }
    .match-item:active { background: var(--bg-card-hover); }

    .match-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .match-teams {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .team-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .team-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
      border-radius: 4px;
    }

    .match-status-box {
      min-width: 75px;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .score-text {
      font-weight: 800;
      font-size: 1rem;
      color: var(--text-white);
    }

    .status-text {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .status-text.live {
      color: var(--accent-green);
    }

    .cat-insight {
      background: rgba(255, 159, 10, 0.08);
      border-left: 3px solid var(--accent-orange);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.73rem;
      color: #ffd280;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fav-btn {
      font-size: 1.1rem;
      margin-left: 10px;
      color: var(--text-sub);
    }

    .fav-btn.active {
      color: var(--accent-orange);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 680px;
      background: var(--bg-card);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border: 1px solid var(--border-color);
      padding: 20px 18px 30px;
      animation: slideUp 0.25s ease-out;
      max-height: 85vh;
      overflow-y: auto;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .close-modal {
      background: var(--bg-main);
      border: none;
      color: var(--text-white);
      font-size: 1.2rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    .modal-scorecard {
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
      margin-bottom: 20px;
      background: var(--bg-main);
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }

    .modal-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 35%;
    }

    .modal-team img {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }

    .modal-team span {
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
    }

    .modal-score {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent-orange);
    }

    .modal-analysis-box {
      background: rgba(41, 182, 246, 0.08);
      border: 1px solid rgba(41, 182, 246, 0.2);
      border-radius: 12px;
      padding: 14px;
      margin-top: 15px;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .modal-analysis-title {
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 680px;
      background: rgba(18, 24, 36, 0.98);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-orange);
    }

    .nav-icon {
      font-size: 1.2rem;
    }

    .loader {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-box">
      <div class="brand-badge">SPORTS CAT</div>
    </div>
    <div class="live-badge">
      <div class="pulse-dot"></div>
      <span>EN VIVO</span>
    </div>
  </header>

  <div class="date-bar">
    <button class="date-btn" onclick="cambiarFecha('ayer', this)">Ayer</button>
    <button class="date-btn active" onclick="cambiarFecha('hoy', this)">HOY</button>
    <button class="date-btn" onclick="cambiarFecha('manana', this)">Mañana</button>
  </div>

  <div class="sports-nav">
    <div class="sport-chip active" onclick="filtrarDeporte('all', this)">⚡ Todos</div>
    <div class="sport-chip" onclick="filtrarDeporte('baseball', this)">⚾ MLB</div>
    <div class="sport-chip" onclick="filtrarDeporte('basketball', this)">🏀 NBA</div>
    <div class="sport-chip" onclick="filtrarDeporte('soccer', this)">⚽ Fútbol</div>
    <div class="sport-chip" onclick="filtrarDeporte('football', this)">🏈 NFL</div>
  </div>

  <main id="app">
    <div class="loader">Sincronizando información de partidos...</div>
  </main>

  <div class="modal-overlay" id="matchModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalLeagueTitle" style="font-size:0.85rem; font-weight:700; color:var(--accent-orange);">LIGA</span>
        <button class="close-modal" onclick="cerrarModal()">✕</button>
      </div>

      <div class="modal-scorecard">
        <div class="modal-team">
          <img id="modalVisitLogo" src="" alt="">
          <span id="modalVisitName">Visitante</span>
        </div>
        <div>
          <div class="modal-score" id="modalScoreText">0 - 0</div>
          <div style="font-size:0.75rem; color:var(--accent-green); font-weight:700; margin-top:4px;" id="modalStatusText">EN VIVO</div>
        </div>
        <div class="modal-team">
          <img id="modalHomeLogo" src="" alt="">
          <span id="modalHomeName">Local</span>
        </div>
      </div>

      <div class="modal-analysis-box">
        <div class="modal-analysis-title">📊 Cat Stats Intelligence</div>
        <div id="modalAnalysisText">Análisis táctico del partido...</div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="cambiarSeccion('partidos', this)">
      <span class="nav-icon">⚽</span>
      <span>Partidos</span>
    </div>
    <div class="nav-item" onclick="cambiarSeccion('favoritos', this)">
      <span class="nav-icon">⭐</span>
      <span>Favoritos</span>
    </div>
  </nav>

  <script>
    let favoritosIDs = JSON.parse(localStorage.getItem('sportscat_favs') || '[]');
    let vistaActual = 'partidos';
    let deporteFiltroActual = 'all';
    let fechaActualKey = 'hoy';

    const partidosPorFecha = {
      'hoy': [
        // MLB
        { id: 'm1', deporteKey: 'baseball', ligaNombre: 'Major League Baseball', equipoLocal: 'Guardians', logoLocal: 'https://a.espncdn.com/i/teamlogos/mlb/50/cle.png', puntosLocal: '3', equipoVisitante: 'Rays', logoVisitante: 'https://a.espncdn.com/i/teamlogos/mlb/50/tb.png', puntosVisitante: '1', estado: 'Top 7th', esEnVivo: true, insight: 'Rays domina la serie particular con efectividad en bullpen.' },
        { id: 'm2', deporteKey: 'baseball', ligaNombre: 'Major League Baseball', equipoLocal: 'Yankees', logoLocal: 'https://a.espncdn.com/i/teamlogos/mlb/50/nyy.png', puntosLocal: '5', equipoVisitante: 'Red Sox', logoVisitante: 'https://a.espncdn.com/i/teamlogos/mlb/50/bos.png', puntosVisitante: '4', estado: 'Final', esEnVivo: false, insight: 'Clásico de la división este decidido en entradas extras.' },
        { id: 'm3', deporteKey: 'baseball', ligaNombre: 'Major League Baseball', equipoLocal: 'Dodgers', logoLocal: 'https://a.espncdn.com/i/teamlogos/mlb/50/lad.png', puntosLocal: '0', equipoVisitante: 'Giants', logoVisitante: 'https://a.espncdn.com/i/teamlogos/mlb/50/sf.png', puntosVisitante: '0', estado: '8:10 PM', esEnVivo: false, insight: 'Duelo estelar en la costa oeste de la Liga Nacional.' },
        
        // NBA
        { id: 'n1', deporteKey: 'basketball', ligaNombre: 'NBA', equipoLocal: 'Cavaliers', logoLocal: 'https://a.espncdn.com/i/teamlogos/nba/50/cle.png', puntosLocal: '88', equipoVisitante: 'Magic', logoVisitante: 'https://a.espncdn.com/i/teamlogos/nba/50/orl.png', puntosVisitante: '85', estado: '4th Qtr', esEnVivo: true, insight: 'Cavaliers ajusta la defensa perimetral para asegurar la ventaja.' },
        { id: 'n2', deporteKey: 'basketball', ligaNombre: 'NBA', equipoLocal: 'Lakers', logoLocal: 'https://a.espncdn.com/i/teamlogos/nba/50/lal.png', puntosLocal: '112', equipoVisitante: 'Warriors', logoVisitante: 'https://a.espncdn.com/i/teamlogos/nba/50/gs.png', puntosVisitante: '115', estado: 'Final', esEnVivo: false, insight: 'Intenso duelo de triples definido en los últimos segundos.' },
        { id: 'n3', deporteKey: 'basketball', ligaNombre: 'NBA', equipoLocal: 'Celtics', logoLocal: 'https://a.espncdn.com/i/teamlogos/nba/50/bos.png', puntosLocal: '64', equipoVisitante: 'Knicks', logoVisitante: 'https://a.espncdn.com/i/teamlogos/nba/50/nyk.png', puntosVisitante: '60', estado: '3rd Qtr', esEnVivo: true, insight: 'Dominio absoluto de la pintura por parte del equipo local.' },
        
        // Fútbol
        { id: 'f1', deporteKey: 'soccer', ligaNombre: 'MLS / Fútbol', equipoLocal: 'Inter Miami', logoLocal: 'https://a.espncdn.com/i/teamlogos/soccer/50/18258.png', puntosLocal: '2', equipoVisitante: 'LA Galaxy', logoVisitante: 'https://a.espncdn.com/i/teamlogos/soccer/50/187.png', puntosVisitante: '1', estado: '82\'', esEnVivo: true, insight: 'Presión alta de Inter Miami en el tramo final del partido.' },
        { id: 'f2', deporteKey: 'soccer', ligaNombre: 'UEFA Champions League', equipoLocal: 'Real Madrid', logoLocal: 'https://a.espncdn.com/i/teamlogos/soccer/50/86.png', puntosLocal: '3', equipoVisitante: 'Man City', logoVisitante: 'https://a.espncdn.com/i/teamlogos/soccer/50/382.png', puntosVisitante: '2', estado: 'Final', esEnVivo: false, insight: 'Exhibición táctica en la segunda mitad con goles decisivos.' },

        // NFL
        { id: 'nf1', deporteKey: 'football', ligaNombre: 'NFL', equipoLocal: 'Chiefs', logoLocal: 'https://a.espncdn.com/i/teamlogos/nfl/50/kc.png', puntosLocal: '24', equipoVisitante: 'Ravens', logoVisitante: 'https://a.espncdn.com/i/teamlogos/nfl/50/bal.png', puntosVisitante: '17', estado: 'Final', esEnVivo: false, insight: 'Excepcional actuación ofensiva en los pases largos de anotación.' }
      ],
      'ayer': [
        { id: 'ay1', deporteKey: 'baseball', ligaNombre: 'Major League Baseball', equipoLocal: 'Astros', logoLocal: 'https://a.espncdn.com/i/teamlogos/mlb/50/hou.png', puntosLocal: '4', equipoVisitante: 'Rangers', logoVisitante: 'https://a.espncdn.com/i/teamlogos/mlb/50/tex.png', puntosVisitante: '2', estado: 'Final', esEnVivo: false, insight: 'Gran labor monticular del abridor local.' },
        { id: 'ay2', deporteKey: 'basketball', ligaNombre: 'NBA', equipoLocal: 'Bucks', logoLocal: 'https://a.espncdn.com/i/teamlogos/nba/50/mil.png', puntosLocal: '108', equipoVisitante: 'Heat', logoVisitante: 'https://a.espncdn.com/i/teamlogos/nba/50/mia.png', puntosVisitante: '102', estado: 'Final', esEnVivo: false, insight: 'Victoria sufrida defendiendo la ventaja en el último cuarto.' }
      ],
      'manana': [
        { id: 'mn1', deporteKey: 'baseball', ligaNombre: 'Major League Baseball', equipoLocal: 'Braves', logoLocal: 'https://a.espncdn.com/i/teamlogos/mlb/50/atl.png', puntosLocal: '-', equipoVisitante: 'Phillies', logoVisitante: 'https://a.espncdn.com/i/teamlogos/mlb/50/phi.png', puntosVisitante: '-', estado: '7:05 PM', esEnVivo: false, insight: 'Duelo divisional de pronóstico reservado.' },
        { id: 'mn2', deporteKey: 'basketball', ligaNombre: 'NBA', equipoLocal: 'Mavericks', logoLocal: 'https://a.espncdn.com/i/teamlogos/nba/50/dal.png', puntosLocal: '-', equipoVisitante: 'Thunder', logoVisitante: 'https://a.espncdn.com/i/teamlogos/nba/50/okc.png', puntosVisitante: '-', estado: '8:30 PM', esEnVivo: false, insight: 'Enfrentamiento directo entre estrellas jóvenes de la liga.' }
      ]
    };

    function cargarPartidos() {
      let eventos = partidosPorFecha[fechaActualKey] || [];

      if (deporteFiltroActual !== 'all') {
        eventos = eventos.filter(e => e.deporteKey === deporteFiltroActual);
      }

      if (vistaActual === 'favoritos') {
        eventos = eventos.filter(e => favoritosIDs.includes(e.id));
      }

      renderizarLigas(eventos);
    }

    function renderizarLigas(eventos) {
      const app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = '';

      if (eventos.length === 0) {
        app.innerHTML = '<div class="loader">No hay partidos registrados para este filtro en esta fecha.</div>';
        return;
      }

      const grupos = {};
      eventos.forEach(evt => {
        if (!grupos[evt.ligaNombre]) grupos[evt.ligaNombre] = [];
        grupos[evt.ligaNombre].push(evt);
      });

      for (let liga in grupos) {
        const groupEl = document.createElement('div');
        groupEl.className = 'league-group';

        let matchesHtml = grupos[liga].map(m => {
          const esFav = favoritosIDs.includes(m.id);
          return `
            <div class="match-item" onclick="abrirDetalleModal('${m.id}')">
              <div class="match-main-row">
                <div class="match-teams">
                  <div class="team-row">
                    <img class="team-logo" src="${m.logoVisitante}" alt="">
                    <span>${m.equipoVisitante}</span>
                  </div>
                  <div class="team-row">
                    <img class="team-logo" src="${m.logoLocal}" alt="">
                    <span>${m.equipoLocal}</span>
                  </div>
                </div>
                <div class="match-status-box">
                  <div class="score-text">${m.puntosVisitante} - ${m.puntosLocal}</div>
                  <div class="status-text ${m.esEnVivo ? 'live' : ''}">${m.esEnVivo ? '🔴 ' + m.estado : m.estado}</div>
                </div>
                <span class="fav-btn ${esFav ? 'active' : ''}" onclick="toggleFav(event, '${m.id}')">⭐</span>
              </div>
              <div class="cat-insight">
                <span>💡 ${m.insight}</span>
              </div>
            </div>
          `;
        }).join('');

        groupEl.innerHTML = `
          <div class="league-header">
            <span>🏆 ${liga}</span>
          </div>
          ${matchesHtml}
        `;

        app.appendChild(groupEl);
      }
    }

    function cambiarFecha(tipo, btn) {
      document.querySelectorAll('.d
