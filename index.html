<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sports Cat - Resultados en Vivo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: #121824;
      --bg-card-hover: #1a2234;
      --border-color: #1e283d;
      --accent-green: #00e676;
      --accent-orange: #ff9f0a;
      --accent-blue: #29b6f6;
      --text-white: #ffffff;
      --text-muted: #8d9bb0;
      --text-sub: #5c6b80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      padding-bottom: 75px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header Pro */
    header {
      width: 100%;
      max-width: 680px;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #ff9f0a, #ff5e3a);
      color: #000;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      letter-spacing: 1.2px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-green);
      background: rgba(0, 230, 118, 0.12);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 230, 118, 0.25);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    /* Selector de Fechas */
    .date-bar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-around;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 0;
    }

    .date-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .date-btn.active {
      background: rgba(255, 159, 10, 0.15);
      color: var(--accent-orange);
    }

    /* Pestañas de Deportes */
    .sports-nav {
      width: 100%;
      max-width: 680px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 10px 16px;
      scrollbar-width: none;
    }
    .sports-nav::-webkit-scrollbar { display: none; }

    .sport-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-right: 6px;
      cursor: pointer;
    }

    .sport-chip.active {
      background: var(--accent-orange);
      color: #000;
      border-color: var(--accent-orange);
    }

    /* Contenedor principal */
    main {
      width: 100%;
      max-width: 680px;
      padding: 0 12px;
    }

    /* Grupo por Liga */
    .league-group {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .league-header {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .league-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .league-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    /* Tarjeta de Partido */
    .match-item {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.15s;
    }

    .match-item:last-child { border-bottom: none; }
    .match-item:active { background: var(--bg-card-hover); }

    .match-teams {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .team-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .team-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .match-status-box {
      min-width: 65px;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .score-text {
      font-weight: 800;
      font-size: 1rem;
      color: var(--text-white);
    }

    .status-text {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .status-text.live {
      color: var(--accent-green);
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 680px;
      background: rgba(18, 24, 36, 0.98);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-orange);
    }

    .nav-icon {
      font-size: 1.2rem;
    }

    .loader {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-box">
      <div class="brand-badge">SPORTS CAT</div>
    </div>
    <div class="live-badge">
      <div class="pulse-dot"></div>
      <span>EN VIVO</span>
    </div>
  </header>

  <!-- Navegador de Fechas -->
  <div class="date-bar">
    <button class="date-btn" onclick="cambiarFecha('ayer', this)">Ayer</button>
    <button class="date-btn active" onclick="cambiarFecha('hoy', this)">HOY</button>
    <button class="date-btn" onclick="cambiarFecha('manana', this)">Mañana</button>
  </div>

  <!-- Pestañas de Deportes acotados -->
  <div class="sports-nav">
    <div class="sport-chip active" onclick="filtrarDeporte('all', this)">⚡ Todos</div>
    <div class="sport-chip" onclick="filtrarDeporte('baseball', this)">⚾ MLB</div>
    <div class="sport-chip" onclick="filtrarDeporte('basketball', this)">🏀 NBA</div>
    <div class="sport-chip" onclick="filtrarDeporte('soccer', this)">⚽ Fútbol</div>
    <div class="sport-chip" onclick="filtrarDeporte('football', this)">🏈 NFL</div>
    <div class="sport-chip" onclick="filtrarDeporte('mma', this)">🥊 UFC</div>
  </div>

  <main id="app">
    <div class="loader">Cargando la mejor información deportiva...</div>
  </main>

  <!-- Barra de Navegación Inferior Tipo App Nativa -->
  <nav class="bottom-nav">
    <div class="nav-item active">
      <span class="nav-icon">⚽</span>
      <span>Partidos</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🏆</span>
      <span>Ligas</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">⭐</span>
      <span>Favoritos</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🔍</span>
      <span>Buscar</span>
    </div>
  </nav>

  <script>
    let todosLosEventos = [];

    // Cargar eventos directo desde feed multideporte rápido (ESPN API Endpoints)
    async function cargarPartidos() {
      const app = document.getElementById('app');
      app.innerHTML = '<div class="loader">Sincronizando marcadores en tiempo real...</div>';

      const endpoints = [
        { sport: 'baseball', league: 'mlb', name: 'MLB' },
        { sport: 'basketball', league: 'nba', name: 'NBA' },
        { sport: 'soccer', league: 'usa.1', name: 'Fútbol' },
        { sport: 'football', league: 'nfl', name: 'NFL' }
      ];

      try {
        let promesas = endpoints.map(ep => 
          fetch(`https://site.api.espn.com/apis/site/v2/sports/${ep.sport}/${ep.league}/scoreboard`)
            .then(res => res.json())
            .catch(() => null)
        );

        let resultados = await Promise.all(promesas);
        todosLosEventos = [];

        resultados.forEach((data, index) => {
          if (data && data.events) {
            data.events.forEach(evt => {
              const comp = evt.competitions[0];
              todosLosEventos.push({
                id: evt.id,
                deporteKey: endpoints[index].sport,
                ligaNombre: data.leagues[0]?.name || endpoints[index].name,
                equipoLocal: comp.competitors[0].team.shortDisplayName || comp.competitors[0].team.name,
                logoLocal: comp.competitors[0].team.logo,
                puntosLocal: comp.competitors[0].score,
                equipoVisitante: comp.competitors[1].team.shortDisplayName || comp.competitors[1].team.name,
                logoVisitante: comp.competitors[1].team.logo,
                puntosVisitante: comp.competitors[1].score,
                estado: evt.status.type.shortDetail,
                esEnVivo: evt.status.type.state === 'in'
              });
            });
          }
        });

        renderizarLigas(todosLosEventos);

      } catch (err) {
        app.innerHTML = '<div class="loader">Error cargando partidos. Reintentando...</div>';
      }
    }

    function renderizarLigas(eventos) {
      const app = document.getElementById('app');
      app.innerHTML = '';

      if (eventos.length === 0) {
        app.innerHTML = '<div class="loader">No hay eventos en vivo o programados para este filtro hoy.</div>';
        return;
      }

      // Agrupar por liga
      const grupos = {};
      eventos.forEach(evt => {
        if (!grupos[evt.ligaNombre]) grupos[evt.ligaNombre] = [];
        grupos[evt.ligaNombre].push(evt);
      });

      for (let liga in grupos) {
        const groupEl = document.createElement('div');
        groupEl.className = 'league-group';

        let matchesHtml = grupos[liga].map(m => `
          <div class="match-item">
            <div class="match-teams">
              <div class="team-row">
                <img class="team-logo" src="${m.logoVisitante || 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/default-team-logo.png'}" alt="">
                <span>${m.equipoVisitante}</span>
              </div>
              <div class="team-row">
                <img class="team-logo" src="${m.logoLocal || 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/default-team-logo.png'}" alt="">
                <span>${m.equipoLocal}</span>
              </div>
            </div>
            <div class="match-status-box">
              <div class="score-text">${m.puntosVisitante ?? '-'} - ${m.puntosLocal ?? '-'}</div>
              <div class="status-text ${m.esEnVivo ? 'live' : ''}">${m.esEnVivo ? '🔴 ' + m.estado : m.estado}</div>
            </div>
          </div>
        `).join('');

        groupEl.innerHTML = `
          <div class="league-header">
            <div class="league-title">
              <span>🏆 ${liga}</span>
            </div>
          </div>
          ${matchesHtml}
        `;

        app.appendChild(groupEl);
      }
    }

    function filtrarDeporte(sportKey, btn) {
      document.querySelectorAll('.sport-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (sportKey === 'all') {
        renderizarLigas(todosLosEventos);
      } else {
        const filtrados = todosLosEventos.filter(e => e.deporteKey === sportKey);
        renderizarLigas(filtrados);
      }
    }

    function cambiarFecha(tipo, btn) {
      document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      cargarPartidos();
    }

    cargarPartidos();
  </script>
</body>
</html>
